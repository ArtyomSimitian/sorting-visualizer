<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Sorting Visualizer favicon">
    <title>Sorting Visualizer</title>

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2a1f18"/>
            <stop offset="0.55" stop-color="#111016"/>
            <stop offset="1" stop-color="#0f0d22"/>
        </linearGradient>

        <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f1f1f1"/>
            <stop offset="1" stop-color="#b6bac4"/>
        </linearGradient>

        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#f59e0b"/>
            <stop offset="1" stop-color="#8b5cf6"/>
        </linearGradient>

        <clipPath id="clip">
            <rect x="2" y="2" width="60" height="60" rx="14"/>
        </clipPath>
    </defs>

    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

    <!-- Subtle grid -->
    <g clip-path="url(#clip)" opacity="0.12" stroke="#ffffff" stroke-width="1">
        <path d="M16 2V62M32 2V62M48 2V62"/>
        <path d="M2 16H62M2 32H62M2 48H62"/>
    </g>

    <!-- Sorting bars (inset so they don't hit rounded corner) -->
    <g clip-path="url(#clip)">
        <rect x="8" y="54" width="48" height="2" rx="1" fill="#ffffff" opacity="0.10"/>

        <!-- 7 bars (ascending) -->
        <rect x="6"  y="40" width="5" height="14" rx="2" fill="url(#bar)" opacity="0.95"/>
        <rect x="14" y="36" width="5" height="18" rx="2" fill="url(#bar)" opacity="0.95"/>
        <rect x="22" y="32" width="5" height="22" rx="2" fill="url(#bar)" opacity="0.95"/>
        <rect x="30" y="28" width="5" height="26" rx="2" fill="url(#accent)" opacity="0.95"/>
        <rect x="38" y="24" width="5" height="30" rx="2" fill="url(#bar)" opacity="0.95"/>
        <rect x="46" y="20" width="5" height="34" rx="2" fill="url(#bar)" opacity="0.95"/>
        <rect x="54" y="16" width="5" height="38" rx="2" fill="url(#bar)" opacity="0.95"/>
    </g>

    <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#ffffff" opacity="0.10"/>
</svg>