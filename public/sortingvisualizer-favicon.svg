<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Sorting Visualizer favicon">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#121834"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="barShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.00"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.00"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <g filter="url(#shadow)">
    <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)"/>
    <rect x="28" y="28" width="456" height="456" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="6"/>
  </g>

  <!-- Ascending bars -->
  <g filter="url(#barShadow)">
    <!-- (start_x=65, bar_w=70, gap=34, base_y=410) heights: 150,210,280,330 -->
    <rect x="65"  y="260" width="70" height="150" rx="26" fill="#2DD4BF"/>
    <rect x="169" y="200" width="70" height="210" rx="26" fill="#2DD4BF"/>
    <rect x="273" y="130" width="70" height="280" rx="26" fill="#2DD4BF"/>
    <rect x="377" y="80"  width="70" height="330" rx="26" fill="#2DD4BF"/>
  </g>

  <!-- Bar highlights (subtle sheen) -->
  <g opacity="0.9">
    <rect x="75"  y="270" width="14" height="130" rx="10" fill="#FFFFFF" opacity="0.14"/>
    <rect x="179" y="210" width="14" height="190" rx="10" fill="#FFFFFF" opacity="0.14"/>
    <rect x="283" y="140" width="14" height="260" rx="10" fill="#FFFFFF" opacity="0.14"/>
    <rect x="387" y="90"  width="14" height="310" rx="10" fill="#FFFFFF" opacity="0.14"/>

    <rect x="75"  y="270" width="50" height="18" rx="10" fill="#FFFFFF" opacity="0.09"/>
    <rect x="179" y="210" width="50" height="18" rx="10" fill="#FFFFFF" opacity="0.09"/>
    <rect x="283" y="140" width="50" height="18" rx="10" fill="#FFFFFF" opacity="0.09"/>
    <rect x="387" y="90"  width="50" height="18" rx="10" fill="#FFFFFF" opacity="0.09"/>
  </g>

  <!-- Top-right "sorted" badge -->
  <g>
    <circle cx="426" cy="86" r="62" fill="#091228" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
    <!-- Checkmark -->
    <path d="M404 88 L418 104 L452 66"
          fill="none" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
