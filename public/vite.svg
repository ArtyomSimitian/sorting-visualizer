<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e2e"/>
      <stop offset="1" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb600"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#bg)" stroke="#464646" stroke-width="2" filter="url(#shadow)"/>

  <!-- Bars -->
  <g>
    <rect x="16" y="34" width="6" height="16" rx="3" fill="url(#bar)"/>
    <rect x="26" y="28" width="6" height="22" rx="3" fill="url(#bar)"/>
    <rect x="36" y="22" width="6" height="28" rx="3" fill="url(#bar)"/>
    <rect x="46" y="16" width="6" height="34" rx="3" fill="url(#bar)"/>
  </g>

  <!-- Badge -->
  <g filter="url(#shadow)">
    <circle cx="50" cy="14" r="8" fill="#171717" stroke="#ff7a00" stroke-width="2"/>
    <path d="M46.5 14.2 L49.2 16.8 L54.2 11.7"
          fill="none" stroke="#ff7a00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
